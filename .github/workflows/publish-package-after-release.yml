# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish package

on:
  release:
    types:
      - released

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false # last one must win in case of multiple releases

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: "false"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          show-progress: false

      - &determine_version
        name: Determine version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # tags are vX.Y.Z, package versions are not prefixed
          echo "version=${REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        uses: $/.github/actions/build-package
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          if-no-files-found: error
          path: |
            dist
            package.json
            README.md
            LICENSE

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-26.04
    environment:
      name: github-packages
      url: https://github.com/orgs/actions-rs-plus/packages/npm/package/core
    needs:
      - build
    permissions:
      contents: read
      packages: write
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - &download_artifact
        name: Download package artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: package

      - name: Set up node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --provenance --access public

  publish-npmjs:
    name: Publish to npmjs
    runs-on: ubuntu-26.04
    environment:
      name: npmjs
      url: https://www.npmjs.com/package/@actions-rs-plus/core/v/${{ steps.version.outputs.version }}
    needs:
      - build
    permissions:
      contents: read
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - *determine_version

      - *download_artifact

      - name: Set up node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Publish
        shell: bash
        run: |
          npm publish --provenance --access public

  all-done:
    name: All done
    # this is the job that should be marked as required on GitHub. It's the only one that'll reliably trigger
    # when any upstream fails: success
    # when all upstream skips: pass
    # when all upstream success: success
    # combination of upstream skip and success: success
    runs-on: ubuntu-26.04
    needs:
      - build
      - publish-github-packages
      - publish-npmjs
    if: |
      always()
    steps:
      - name: Fail!
        shell: bash
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One / more upstream failed or was cancelled. Failing job..."

          exit 1

      - name: Success!
        shell: bash
        run: |
          echo "Great success!"
