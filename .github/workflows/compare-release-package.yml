# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Compare release package

on:
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: "false"

jobs:
  compare:
    name: Compare release package against latest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write # to create and update the comparison comment
    if: startsWith(github.head_ref, 'release/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Determine version
        id: version
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # release/v1.2.3 -> 1.2.3
          echo "version=${HEAD_REF#release/v}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        uses: $/.github/actions/build-package
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Pack
        id: pack
        shell: bash
        run: |
          filename=$(npm pack --json --pack-destination "${RUNNER_TEMP}" | jq --raw-output '.[0].filename')
          echo "tarball=${RUNNER_TEMP}/${filename}" >> "${GITHUB_OUTPUT}"

      - name: Diff against the latest published package
        id: diff
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(jq --raw-output '.name' package.json)

          # .npmrc points the scope at GitHub Packages, npmjs serves the same package without a token
          registry="--${name%%/*}:registry=https://registry.npmjs.org/"
          latest=$(npm view "${name}" dist-tags.latest "${registry}")

          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

          npm diff --diff-name-only --diff="${name}@${latest}" --diff="${TARBALL}" "${registry}" > "${RUNNER_TEMP}/files.txt"

          # source maps are single-line JSON, they are listed but left out of the patch
          npm diff --diff="${name}@${latest}" --diff="${TARBALL}" "${registry}" \
            package.json README.md 'dist/**/*.js' 'dist/**/*.d.ts' > "${RUNNER_TEMP}/patch.diff"

          {
            echo "## \`${name}\` ${latest} → ${VERSION}"
            echo

            if [ ! -s "${RUNNER_TEMP}/files.txt" ]; then
              echo "No file changed."
            else
              echo "Changed files:"
              echo
              sed "s/.*/- \`&\`/" "${RUNNER_TEMP}/files.txt"

              if [ -s "${RUNNER_TEMP}/patch.diff" ]; then
                # the fence has to be longer than any backtick run in the patch, README.md contains Markdown
                fence='```'
                while grep --quiet --fixed-strings -- "${fence}" "${RUNNER_TEMP}/patch.diff"; do
                  fence="${fence}\`"
                done

                echo
                echo "${fence}diff"
                cat "${RUNNER_TEMP}/patch.diff"
                echo "${fence}"
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Update the PR comment
        # a run cancelled by a newer one must not overwrite the newer result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          LATEST: ${{ steps.diff.outputs.latest }}
          NAME: ${{ steps.diff.outputs.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          marker="<!-- compare-release-package -->"

          {
            echo "${marker}"

            if [ "${JOB_STATUS}" = "success" ]; then
              echo "### Package diff: \`${NAME}\` ${LATEST} → ${VERSION}"
              echo

              count=$(wc --lines < "${RUNNER_TEMP}/files.txt")

              if [ "${count}" -eq 0 ]; then
                echo "No file changed."
              else
                files=$(sed "s/.*/\`&\`/" "${RUNNER_TEMP}/files.txt" | paste --serial --delimiters=",")
                echo "Changed files (${count}): ${files//,/, }"
              fi

              echo
              echo "[Full diff in the job summary](${RUN_URL})"
            else
              echo "### Package diff"
              echo
              echo "The comparison failed, see [the run](${RUN_URL})."
            fi
          } > "${RUNNER_TEMP}/comment.md"

          # --jq applies to each page, so the first match is the first line
          comment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id")
          comment_id="${comment_ids%%$'\n'*}"

          if [ -n "${comment_id}" ]; then
            gh api --method PATCH --silent "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --field "body=@${RUNNER_TEMP}/comment.md"
          else
            gh api --method POST --silent "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field "body=@${RUNNER_TEMP}/comment.md"
          fi
